<div class="h-screen w-full bg-zinc-950 text-white flex flex-col justify-center items-center">
    <div class="mb-5 text-center">
        <h1 class="text-3xl font-bold text-red-500 tracking-wider uppercase">Admin Portal</h1>
    </div>
    <form (ngSubmit)="submitHandler()"
        class="border-[1px] w-full md:w-1/3 border-zinc-800 md:p-8 rounded-lg p-4 bg-[#111218] shadow-2xl">
        <h2 class="text-center mb-6 text-xl text-zinc-400">Restricted Access</h2>
        <div>
            <input
                class="w-full px-3 focus:bg-zinc-800 py-3 placeholder:text-zinc-500 my-3 rounded-lg bg-zinc-900 border border-zinc-800 focus:border-red-500 outline-none transition-colors"
                type="email" name="email" placeholder="Admin Email" [(ngModel)]="data.email" required
                autocomplete="off" />
        </div>
        <div>
            <input
                class="w-full focus:bg-zinc-800 px-3 py-3 placeholder:text-zinc-500 my-3 rounded-lg bg-zinc-900 border border-zinc-800 focus:border-red-500 outline-none transition-colors"
                type="password" placeholder="Password" name="password" [(ngModel)]="data.password" required />
        </div>
        <button type="submit" [disabled]="isLoading"
            class="py-3 w-full px-3 rounded-lg font-bold mt-5 bg-red-600 hover:bg-red-500 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 transition-colors">
            <span *ngIf="isLoading"
                class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            {{ isLoading ? 'Authenticating...' : 'Secure Login' }}
        </button>
    </form>
</div>
