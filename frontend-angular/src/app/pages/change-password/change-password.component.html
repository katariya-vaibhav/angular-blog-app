<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md rounded-2xl border border-zinc-800 bg-zinc-900/60 p-6 md:p-8 shadow-lg shadow-blue-950/30">
    <div class="mb-6">
      <p class="text-xs font-medium uppercase tracking-[0.2em] text-blue-400">Security</p>
      <h1 class="text-2xl font-semibold text-white">Change password</h1>
      <p class="text-sm text-zinc-400 mt-1">
        Update your password to keep your account secure.
      </p>
    </div>

    <form (ngSubmit)="submitHandler()" class="space-y-4">
      <div>
        <label class="text-sm text-zinc-300">Old password</label>
        <input
          class="mt-1 w-full rounded-xl bg-zinc-950/40 border border-zinc-800 px-3 py-2 text-zinc-100 outline-none focus:border-blue-500/60 focus:ring-1 focus:ring-blue-500/60"
          type="password"
          name="oldPassword"
          [(ngModel)]="data.oldPassword"
          required
        />
      </div>

      <div>
        <label class="text-sm text-zinc-300">New password</label>
        <input
          class="mt-1 w-full rounded-xl bg-zinc-950/40 border border-zinc-800 px-3 py-2 text-zinc-100 outline-none focus:border-blue-500/60 focus:ring-1 focus:ring-blue-500/60"
          type="password"
          name="newPassword"
          [(ngModel)]="data.newPassword"
          required
        />
      </div>

      <div>
        <label class="text-sm text-zinc-300">Confirm new password</label>
        <input
          class="mt-1 w-full rounded-xl bg-zinc-950/40 border border-zinc-800 px-3 py-2 text-zinc-100 outline-none focus:border-blue-500/60 focus:ring-1 focus:ring-blue-500/60"
          type="password"
          name="confirmPassword"
          [(ngModel)]="data.confirmPassword"
          required
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-full bg-blue-600 px-5 py-2 text-sm font-medium text-white hover:bg-blue-500 transition"
      >
        Update password
      </button>

      <p *ngIf="message" class="text-sm text-center text-zinc-300">
        {{ message }}
      </p>
    </form>
  </div>
</div>
