<div class="min-h-screen lg:mx-[15rem] my-10 text-white">
    @if (!loading) {
    <div class="min-h-screen w-full">
        <div class="my-5 flex items-center justify-between">
            <a [routerLink]="['/profile', data?.owner?._id]">
                <div class="flex items-center gap-3">
                    <img class="h-10 w-10 border-[1px] border-zinc-700 p-1 rounded-full object-cover"
                        [src]="data?.owner?.avatar" [alt]="data?.owner?._id" />
                    <p>{{ data?.owner?.username }}</p>
                </div>
            </a>
            <p class="text-end text-sm text-zinc-400">
                {{ data?.createdAt | date:'medium' }}
            </p>
        </div>

        <div class="h-[15rem] md:h-[30rem]">
            <img class="p-2 object-cover rounded-3xl h-[100%] w-[100%]" [src]="data?.image" [alt]="data?._id" />
        </div>

        <div class="p-2">
            @if (authService.currentUser()?._id === data?.owner?._id) {
            <div class="flex justify-end gap-3">
                <button
                    class="py-1 text-sm px-3 border-[1px] font-semibold text-red-500 hover:text-white hover:bg-red-600 hover:border-none rounded-full"
                    (click)="deleteHandler()">
                    DELETE
                </button>
                <button class="py-1 text-sm px-3 border-[1px] font-semibold rounded-full" (click)="editMode = true">
                    UPDATE
                </button>
            </div>
            }

            @if (editMode) {
            <form (ngSubmit)="updateHandler()" class="my-4">
                <!-- <div class="mb-4">
                    <label class="block text-sm font-medium">Cover image (optional)</label>
                    <input type="file" (change)="handleFileChange($event)" accept="image/*"
                        class="w-full my-2 outline-none p-2 border border-zinc-700 rounded bg-zinc-900 text-white" />
                    @if (imageFile) {
                    <p class="text-xs text-zinc-400">Selected: {{ imageFile.name }}</p>
                    }
                </div> -->
                <div>
                    <label class="block text-sm font-medium">Title</label>
                    <input type="text" [(ngModel)]="titleInput" name="title"
                        class="w-full my-2 outline-none p-2 border-none rounded bg-zinc-800 text-white" />
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium">Category</label>
                    <input type="text" [(ngModel)]="categoryInput" name="category"
                        class="w-full my-2 outline-none p-2 border-none rounded bg-zinc-800 text-white" />
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium">Description</label>
                    <quill-editor [(ngModel)]="descriptionInput" name="description" [styles]="{height: '300px'}"
                        class="block w-full text-white"></quill-editor>
                </div>
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" class="py-1 text-sm px-3 border-[1px] font-semibold rounded-full"
                        (click)="editMode = false">
                        Cancel
                    </button>
                    <button type="submit"
                        class="py-1 text-sm px-3 border-[1px] font-semibold text-green-500 hover:text-white hover:bg-green-600 hover:border-none rounded-full">
                        Save
                    </button>
                </div>
            </form>
            } @else {
            <h2 class="text-2xl my-2 font-semibold">{{ data?.title }}</h2>
            <div class="my-4 text-zinc-300 w-full text-wrap overflow-x-auto" [innerHTML]="data?.description"></div>
            }
        </div>

        <div class="py-5 border-t-[1px] border-zinc-700">
            @if (id) {
            <app-comment [blogId]="id"></app-comment>
            }
        </div>
    </div>
    } @else {
    <h1 class="flex justify-center items-center h-screen">Loading.....</h1>
    }
</div>
