<div class="min-h-[90vh] flex items-center justify-center px-6 py-12">
    <div class="glass max-w-lg w-full p-8 md:p-12 rounded-[2.5rem] shadow-2xl space-y-10 animate-in fade-in slide-in-from-bottom-4 duration-500">
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-bold text-white tracking-tight">Join BlogSphere</h1>
            <p class="text-zinc-500 font-medium">Start your creative journey today.</p>
        </div>

        <form (ngSubmit)="submitHandler()" class="space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Display Name</label>
                <input
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white focus:border-blue-500/50 outline-none transition-all"
                    type="text" name="username" placeholder="How should we call you?" [(ngModel)]="data.username" required 
                />
            </div>
            
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Email Address</label>
                <input
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white focus:border-blue-500/50 outline-none transition-all"
                    type="email" name="email" placeholder="name@example.com" [(ngModel)]="data.email" required 
                />
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Secure Password</label>
                <input
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white focus:border-blue-500/50 outline-none transition-all"
                    type="password" placeholder="Min. 8 characters" name="password" [(ngModel)]="data.password" required 
                />
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Identity Icon</label>
                <div (click)="imageRef.click()" class="cursor-pointer group">
                    <input hidden #imageRef type="file" name="avatar" (change)="handleFileChange($event)" />
                    <div class="w-full bg-white/5 border-2 border-dashed border-white/10 rounded-2xl p-6 flex flex-col items-center gap-2 group-hover:border-blue-500/50 transition-all bg-zinc-800/20">
                        <svg class="w-6 h-6 text-zinc-500 group-hover:text-blue-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span class="text-xs font-bold text-zinc-400 group-hover:text-white transition-colors">Select profile image</span>
                    </div>
                </div>
            </div>

            <button type="submit" [disabled]="isLoading" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 transition-all shadow-lg shadow-blue-600/20">
                <span *ngIf="isLoading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                {{ isLoading ? 'Creating Account...' : 'Get Started' }}
            </button>
        </form>

        <p class="text-center text-zinc-500 font-medium pt-4">
            Already part of the community? 
            <a routerLink="/login" class="text-blue-500 hover:text-blue-400 font-bold transition-colors">Sign In</a>
        </p>
    </div>
</div>
