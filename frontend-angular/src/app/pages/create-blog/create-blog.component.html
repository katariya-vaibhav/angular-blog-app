<div class="min-h-screen pb-20 pt-10 px-4 md:px-8">
    <div class="max-w-6xl mx-auto space-y-12">
        <!-- Header -->
        <div class="text-center md:text-left space-y-3">
            <h1 class="text-4xl md:text-6xl font-bold text-white tracking-tight">Craft Your <span class="text-blue-500">Masterpiece</span></h1>
            <p class="text-zinc-500 font-medium text-lg">Share your insights with the world using our premium creation tools.</p>
        </div>

        <form (ngSubmit)="submitHandler()" class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- Left Column: Metadata & Media -->
            <div class="lg:col-span-5 space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="glass p-8 rounded-[2.5rem] space-y-8">
                    <!-- Image Upload -->
                    <div class="space-y-4">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Cover Preview</label>
                        <div (click)="imageRef.click()" class="group relative aspect-video rounded-3xl overflow-hidden border-2 border-dashed border-white/10 hover:border-blue-500/50 transition-all cursor-pointer bg-zinc-800/20">
                            <input hidden #imageRef type="file" name="image" (change)="handleFileChange($event)" />
                            <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 group-hover:bg-blue-600/5 transition-all">
                                <div class="w-12 h-12 rounded-2xl bg-zinc-800 flex items-center justify-center group-hover:bg-blue-600 transition-colors">
                                    <svg class="w-6 h-6 text-zinc-400 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                    </svg>
                                </div>
                                <span class="text-sm font-bold text-zinc-500 group-hover:text-zinc-300">Click to upload cover image</span>
                            </div>
                        </div>
                    </div>

                    <!-- Basic Info -->
                    <div class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Article Title</label>
                            <input [(ngModel)]="data.title" name="title" required
                                class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white focus:border-blue-500/50 outline-none transition-all placeholder:text-zinc-600"
                                type="text" placeholder="Something catchy..." />
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Category</label>
                            <input [(ngModel)]="data.category" name="category" required
                                class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white focus:border-blue-500/50 outline-none transition-all placeholder:text-zinc-600"
                                type="text" placeholder="e.g. Technology, Lifestyle" />
                        </div>
                    </div>
                </div>
                
                <!-- AI Power Card -->
                <div class="bg-gradient-to-br from-indigo-600/20 to-purple-600/20 border border-indigo-500/20 p-8 rounded-[2.5rem] space-y-4">
                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                        <span class="text-2xl">✨</span> AI Content Engine
                    </h3>
                    <p class="text-zinc-400 text-sm leading-relaxed">
                        Stuck on a draft? Let our AI help you generate a professional starting point based on your title and category.
                    </p>
                    <button type="button" (click)="genContent()" [disabled]="isGenerating"
                        class="w-full py-4 bg-white text-black font-bold rounded-2xl hover:bg-indigo-500 hover:text-white transition-all duration-300 flex items-center justify-center gap-3 disabled:opacity-50">
                        <span *ngIf="isGenerating" class="w-5 h-5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></span>
                        {{ isGenerating ? 'AI is thinking...' : 'Generate with AI' }}
                    </button>
                </div>
            </div>

            <!-- Right Column: Editor -->
            <div class="lg:col-span-7 space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500 delay-150">
                <div class="glass rounded-[2.5rem] overflow-hidden p-2 min-h-[600px] flex flex-col">
                    <div class="p-6 border-b border-white/5 flex items-center justify-between">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Article Body</span>
                        <div class="flex gap-1.5">
                            <div class="w-2.5 h-2.5 rounded-full bg-red-500/40"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-yellow-500/40"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-green-500/40"></div>
                        </div>
                    </div>
                    <div class="flex-1 p-4">
                        <quill-editor theme="snow" [style]="{height: '450px'}" name="description"
                            [(ngModel)]="description" class="ql-premium">
                        </quill-editor>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <!-- <button type="button" routerLink="/" class="flex-1 py-4 glass text-white font-bold rounded-2xl hover:bg-white/5 transition-all">
                        Discard Draft
                    </button> -->
                    <button type="submit" [disabled]="isLoading"
                        class="flex-[2] py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-3 disabled:opacity-50">
                        <span *ngIf="isLoading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                        {{ isLoading ? 'Publishing Story...' : 'Publish to BlogSphere' }}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
