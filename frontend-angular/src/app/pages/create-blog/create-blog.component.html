<div class="min-h-screen py-10 px-4 flex flex-col items-center w-full bg-[#07080a] text-zinc-100">

  <div class="mb-10 text-center">
    <h2
      class="text-4xl font-bold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
      Create New Blog
    </h2>
    <p class="text-zinc-500 mt-2">Craft your story with the power of AI</p>
  </div>

  <form (ngSubmit)="submitHandler()"
    class="relative w-full max-w-5xl bg-[#111218] border border-zinc-800 shadow-2xl flex flex-col md:flex-row rounded-3xl overflow-hidden p-6 md:p-8 gap-8">

    <div class="absolute -top-24 -right-24 w-64 h-64 bg-blue-600/10 blur-[100px] rounded-full"></div>
    <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-purple-600/10 blur-[100px] rounded-full"></div>

    <div class="w-full md:w-5/12 flex flex-col gap-6 z-10">

      <div class="group relative">
        <input hidden #imageRef type="file" name="image" (change)="handleFileChange($event)" />
        <div (click)="imageRef.click()"
          class="flex flex-col items-center justify-center h-48 border-2 border-dashed border-zinc-700 rounded-2xl cursor-pointer bg-zinc-900/50 hover:bg-zinc-800/50 hover:border-blue-500/50 transition-all duration-300">
          <div class="p-3 rounded-full bg-zinc-800 group-hover:bg-blue-500/10 transition-colors">
            <svg class="text-2xl text-zinc-400 group-hover:text-blue-400" stroke="currentColor" fill="currentColor"
              viewBox="0 0 16 16" height="1em" width="1em">
              <path fill-rule="evenodd"
                d="M8 0a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 4.095 0 5.555 0 7.318 0 9.366 1.708 11 3.781 11H7.5V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707V11h4.188C14.502 11 16 9.57 16 7.773c0-1.636-1.242-2.969-2.834-3.194C12.923 1.999 10.69 0 8 0zm-.5 14.5V11h1v3.5a.5.5 0 0 1-1 0z">
              </path>
            </svg>
          </div>
          <span class="mt-3 text-sm text-zinc-400 font-medium">Add cover image</span>
        </div>
      </div>

      <div class="space-y-4">
        <div class="relative">
          <input [(ngModel)]="data.title" name="title" required
            class="w-full bg-zinc-900/80 border border-zinc-800 focus:border-blue-500/50 focus:ring-4 focus:ring-blue-500/5 px-4 py-3.5 rounded-xl outline-none transition-all placeholder:text-zinc-600"
            type="text" placeholder="Enter a descriptive title..." />
        </div>

        <div class="relative">
          <input [(ngModel)]="data.category" name="category" required
            class="w-full bg-zinc-900/80 border border-zinc-800 focus:border-blue-500/50 focus:ring-4 focus:ring-blue-500/5 px-4 py-3.5 rounded-xl outline-none transition-all placeholder:text-zinc-600"
            type="text" placeholder="Category (e.g., Technology)" />
        </div>
      </div>
    </div>

    <div class="w-full md:w-7/12 flex flex-col z-10">
      <div class="bg-white rounded-2xl overflow-hidden border border-zinc-800 shadow-inner">
        <quill-editor theme="snow" [style]="{height: '320px', color: '#000'}" name="description"
          [(ngModel)]="description">
        </quill-editor>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-8">
        <button type="button" (click)="genContent()" [disabled]="isGenerating"
          class="group relative flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl font-bold overflow-hidden bg-zinc-900 border border-zinc-700 hover:border-purple-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          <span
            class="absolute inset-0 bg-gradient-to-r from-blue-600/10 to-purple-600/10 opacity-0 group-hover:opacity-100 transition-opacity"></span>
          <span *ngIf="isGenerating"
            class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          <span *ngIf="!isGenerating"
            class="bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent italic font-serif text-lg">✨
            Gen AI</span>
          <span *ngIf="isGenerating"
            class="bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent italic font-serif text-lg">Generating...</span>
        </button>

        <button type="submit" [disabled]="isLoading"
          class="flex justify-center items-center gap-2 py-3.5 px-6 rounded-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 shadow-[0_0_20px_rgba(37,99,235,0.3)] transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="isLoading"
            class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          {{ isLoading ? 'Publishing...' : 'Publish Blog' }}
        </button>
      </div>
    </div>
  </form>
</div>
