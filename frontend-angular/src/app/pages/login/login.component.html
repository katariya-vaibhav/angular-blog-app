<div class="h-screen w-full text-white flex flex-col justify-center items-center">
    <form (ngSubmit)="submitHandler()" class="border-[1px] w-full md:w-1/2 border-zinc-800 md:p-10 rounded-lg p-1">
        <h2 class="text-center mb-3 text-2xl text-zinc-600">Login</h2>
        <div>
            <input
                class="w-full px-3 focus:bg-zinc-800 py-2 placeholder:text-lg my-3 rounded-lg bg-zinc-800 outline-none"
                type="email" name="email" placeholder="Email" [(ngModel)]="data.email" required />
        </div>
        <div>
            <input
                class="w-full focus:bg-zinc-800 px-3 py-2 placeholder:text-lg my-3 rounded-lg bg-zinc-800 outline-none"
                type="password" placeholder="Password" name="password" [(ngModel)]="data.password" required />
        </div>
        <button type="submit" [disabled]="isLoading" class="py-2 w-full px-3 rounded-lg text-md mt-5 bg-blue-500 hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2">
            <span *ngIf="isLoading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            {{ isLoading ? 'Loading...' : 'Submit' }}
        </button>
        <p class="my-2 text-center">
            Already have account?
            <a routerLink="/sign-up" class="text-blue-500 underline">
                Sign-up
            </a>
        </p>
    </form>
</div>
