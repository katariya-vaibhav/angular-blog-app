<div class="min-h-[80vh] flex items-center justify-center px-6">
    <div class="glass max-w-md w-full p-8 md:p-12 rounded-[2.5rem] shadow-2xl space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-bold text-white tracking-tight">Welcome Back</h1>
            <p class="text-zinc-500 font-medium">Elevate your stories today.</p>
        </div>

        <form (ngSubmit)="submitHandler()" class="space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Email Address</label>
                <input
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white focus:border-blue-500/50 outline-none transition-all"
                    type="email" name="email" placeholder="name@example.com" [(ngModel)]="data.email" required 
                />
            </div>
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-2">Password</label>
                <input
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white focus:border-blue-500/50 outline-none transition-all"
                    type="password" placeholder="••••••••" name="password" [(ngModel)]="data.password" required 
                />
            </div>

            <button type="submit" [disabled]="isLoading" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 transition-all shadow-lg shadow-blue-600/20">
                <span *ngIf="isLoading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                {{ isLoading ? 'Entering...' : 'Sign In' }}
            </button>
        </form>

        <p class="text-center text-zinc-500 font-medium">
            New to BlogSphere? 
            <a routerLink="/sign-up" class="text-blue-500 hover:text-blue-400 font-bold transition-colors">Create Account</a>
        </p>
    </div>
</div>
