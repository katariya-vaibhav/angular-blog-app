<div class="group relative bg-zinc-900/50 border border-white/5 rounded-3xl overflow-hidden transition-all duration-500 hover:-translate-y-2 hover:border-white/20 hover:shadow-2xl hover:shadow-blue-500/10 glow-on-hover">
    <!-- Image Wrapper -->
    <a [routerLink]="['/blog-details', blog?._id]" class="block relative aspect-[16/10] overflow-hidden">
        <img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" 
             [src]="blog?.image || '/placeholder-blog.jpg'" 
             [alt]="blog?.title" />
        <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/80 via-transparent to-transparent opacity-60 group-hover:opacity-40 transition-opacity"></div>
        
        <!-- Category Badge -->
        <span class="absolute top-4 left-4 px-3 py-1 rounded-full glass text-[10px] font-bold uppercase tracking-wider text-blue-400">
            {{ blog?.category || 'General' }}
        </span>
    </a>

    <!-- Content -->
    <div class="p-6">
        <div class="flex items-center gap-2 mb-4">
            <a [routerLink]="['/profile', blog?.owner?._id]" class="flex items-center gap-2 group/author">
                <img class="w-6 h-6 rounded-full border border-white/10 group-hover/author:border-blue-500 transition-colors" 
                     [src]="blog?.owner?.avatar || '/placeholder-user.png'" 
                     alt="author" />
                <span class="text-xs text-zinc-400 group-hover/author:text-white transition-colors">
                    @{{ blog?.owner?.username }}
                </span>
            </a>
            <span class="text-zinc-600 font-bold">·</span>
            <span class="text-[10px] text-zinc-500 uppercase tracking-tight">
                {{ blog?.createdAt | date:'mediumDate' }}
            </span>
        </div>

        <a [routerLink]="['/blog-details', blog?._id]" class="block group/title">
            <h3 class="text-xl font-bold text-white/90 group-hover/title:text-blue-400 line-clamp-2 transition-colors duration-300">
                {{ blog?.title }}
            </h3>
        </a>

        <div class="mt-4 flex items-center justify-between">
            <div class="flex items-center gap-1 text-zinc-500">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-[11px] font-medium">5 min read</span>
            </div>
            
            <a [routerLink]="['/blog-details', blog?._id]" class="text-xs font-semibold text-zinc-400 hover:text-white flex items-center gap-1 transition-colors">
                Read More
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                </svg>
            </a>
        </div>
    </div>
</div>
