<header class="sticky top-0 z-50 px-4 md:px-8 py-4">
    <nav class="glass max-w-7xl mx-auto rounded-2xl md:rounded-full px-6 py-3 flex items-center justify-between shadow-2xl shadow-black/50">
        <!-- Logo & Home -->
        <div class="flex items-center gap-6">
            <a routerLink="/" class="group flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-600/10 flex items-center justify-center group-hover:bg-blue-600/20 transition-all duration-300">
                    <svg class="w-5 h-5 text-blue-500 group-hover:scale-110 transition-transform" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <span class="hidden md:block text-lg font-bold tracking-tight text-white/90 group-hover:text-white transition-colors">BlogSphere</span>
            </a>
        </div>

        <!-- Center Logo (Optional/Alt) -->
        <div class="hidden md:block absolute left-1/2 -translate-x-1/2">
            <img class="h-16 opacity-80 hover:opacity-100 transition-opacity" src="/logo.png" alt="logo" />
        </div>

        <!-- Right Side: Profile & Logout -->
        <div class="flex items-center gap-3 md:gap-5">
            <a routerLink="/profile" class="group flex items-center gap-3 px-1 py-1 rounded-full hover:bg-white/5 transition-all">
                <div class="w-8 h-8 rounded-full border border-white/10 overflow-hidden group-hover:border-white/30 transition-colors bg-blue-600/20 flex items-center justify-center">
                    <img *ngIf="authService.currentUser()?.avatar" 
                         class="w-full h-full object-cover" 
                         [src]="authService.currentUser()?.avatar" 
                         [alt]="authService.currentUser()?.username"
                         onerror="this.style.display='none'" />
                    <span *ngIf="!authService.currentUser()?.avatar" class="text-xs font-bold text-blue-400 capitalize">
                        {{ authService.currentUser()?.username?.charAt(0) || '?' }}
                    </span>
                </div>
                <span class="hidden sm:block text-sm font-medium text-zinc-400 group-hover:text-white transition-colors">
                    {{ authService.currentUser()?.username || 'Profile' }}
                </span>
            </a>

            <div class="w-px h-6 bg-white/10 hidden sm:block"></div>

            <button (click)="signOutHandler()" class="p-2 text-zinc-500 hover:text-red-400 hover:bg-red-400/10 rounded-full transition-all duration-300 group" title="Sign Out">
                <svg class="w-5 h-5 group-hover:rotate-12 transition-transform" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </nav>
</header>
