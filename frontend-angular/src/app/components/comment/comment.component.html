<div class="space-y-10">
    <!-- Add Comment -->
    <div class="glass p-2 rounded-3xl shadow-lg border border-white/5 space-y-4">
        <div class="flex items-center gap-3 px-2">
            <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            <h3 class="text-lg font-bold text-white tracking-tight">Post a Comment</h3>
        </div>
        
        <div class="relative flex flex-col md:flex-row gap-4">
            <textarea [(ngModel)]="commentValue"
                class="flex-1 min-h-[30px] bg-white/5 border border-white/10 rounded-2xl px-4 py-2 text-white focus:border-blue-500/50 outline-none transition-all resize-none placeholder:text-zinc-600"
                placeholder="Share your thoughts on this story..."></textarea>
            
            <button (click)="submitCommentHandler()"
                class="bg-blue-600 text-white font-bold px-4 py-2 rounded-2xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-600/20 active:scale-95 flex items-center justify-center">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Comment List -->
    <div class="space-y-6">
        @for (comment of comments; track comment._id) {
            <div class="group relative bg-zinc-900/30 border border-white/5 p-6 rounded-3xl hover:bg-zinc-800/40 hover:border-white/10 transition-all duration-300">
                <div class="flex items-start justify-between gap-4">
                    <div class="flex gap-4">
                        <div class="relative">
                            <img class="w-10 h-10 md:w-12 md:h-12 rounded-full border border-white/10 object-cover"
                                [src]="comment.owner.avatar" [alt]="comment.owner.username" />
                            <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-2 border-zinc-900 rounded-full"></div>
                        </div>
                        <div class="space-y-1">
                            <h4 class="font-bold text-white leading-none">@{{ comment.owner.username }}</h4>
                            <p class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">
                                {{ comment.createdAt | date:'mediumDate' }}
                            </p>
                        </div>
                    </div>
                    
                    @if (authService.currentUser()?._id === comment.owner._id) {
                        <div class="flex gap-2">
                            <button (click)="startEdit(comment)" class="p-2 text-zinc-500 hover:text-blue-400 hover:bg-blue-400/10 rounded-xl transition-all">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                            </button>
                            <button (click)="commentDeleteHandler(comment._id)" class="p-2 text-zinc-500 hover:text-red-400 hover:bg-red-400/10 rounded-xl transition-all">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </div>
                    }
                </div>

                <div class="mt-6 pl-14 md:pl-16">
                    @if (editingCommentId === comment._id) {
                        <div class="space-y-4">
                            <textarea [(ngModel)]="editValue"
                                class="w-full bg-zinc-950 border border-white/10 rounded-2xl px-5 py-3 text-sm text-white focus:border-blue-500/50 outline-none transition-all resize-none"
                                rows="3"></textarea>
                            <div class="flex justify-end gap-3">
                                <button (click)="cancelEdit()" class="px-5 py-2 glass rounded-xl text-xs font-bold text-white transition-all">Cancel</button>
                                <button (click)="saveEdit(comment._id)" class="px-6 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl hover:bg-blue-700 transition-all shadow-lg">Save Edit</button>
                            </div>
                        </div>
                    } @else {
                        <p class="text-zinc-300 leading-relaxed text-base">{{ comment.content }}</p>
                    }
                </div>
            </div>
        }
    </div>
</div>
